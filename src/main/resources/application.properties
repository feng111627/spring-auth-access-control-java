server.port=0

# --- Token security ---
# HMAC signing secret (override with APP_TOKEN_SECRET in real deployments)
app.security.token-secret=local-dev-super-secret-key-change-me-0123456789
app.security.access-token-ttl-millis=300000
app.security.refresh-token-ttl-millis=3600000
app.security.pbkdf2-iterations=120000

# --- Login rate limiting / lockout ---
app.login.max-failures=5
app.login.lock-millis=300000
app.login.max-attempts-per-window=10
app.login.window-millis=60000

# Seed demo accounts
app.users.demo.password=Passw0rd!
