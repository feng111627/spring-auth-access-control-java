server.port=0

# 测试环境：短有效期、小阈值，便于覆盖过期/锁定/限流
auth.hmac-secret=test-secret-key-for-unit-tests-0123456789
auth.access-token-ttl=PT2S
auth.refresh-token-ttl=PT5S
auth.max-login-failures=3
auth.lock-duration=PT300S
auth.ip-max-failures=10
auth.ip-window=PT60S
auth.password.iterations=10000
auth.password.salt-length=16
auth.password.hash-length=32

logging.level.com.github.feng111627=INFO
